name: 🎉 Release Binary

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  release:
    uses: projectdiscovery/workflows/.github/workflows/goreleaser-publish.yaml@v1
    permissions:
      contents: write
    secrets:
      docker-username: ${{ secrets.DOCKER_USERNAME }}
      docker-token: ${{ secrets.DOCKER_TOKEN }}
      slack-webhook: ${{ secrets.RELEASE_SLACK_WEBHOOK }}
      discord-webhook-id: ${{ secrets.DISCORD_WEBHOOK_ID }}
      discord-webhook-token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}

  dockerhub-description:
    name: Update Docker Hub description
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: projectdiscovery/tldfinder
